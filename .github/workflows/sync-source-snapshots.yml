name: Sync Source Snapshots

on:
  schedule:
    - cron: '0 4 * * *'   # daily, 2 hours before daily-ingestion.yml
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Source Snapshots Synchronization
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: node scripts/sync-source-snapshots.js

      - name: Commit snapshot updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache/
          if ! git diff --staged --quiet; then
            git commit -m "chore(cache): refresh source snapshots [skip ci]"
            git push origin main
          else
            echo "No changes in source snapshots today."
          fi
