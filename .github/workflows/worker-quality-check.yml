name: Worker - Quality Check

on:
  schedule:
    # Runs hourly at :40
    - cron: '40 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Batch size of queued jobs to process'
        required: false
        default: '50'

jobs:
  quality-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Hourly cron: never let a slow run overlap the next one.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '50' }}
      # Auto-promotion policy: eligible thin cards flip to 'indexed' when the
      # deterministic gate passes, capped per day. Override via repo variables
      # (Settings → Secrets and variables → Actions → Variables).
      AUTO_PROMOTE_MODELS: ${{ vars.AUTO_PROMOTE_MODELS || 'true' }}
      PROMOTION_CAP: ${{ vars.PROMOTION_CAP || '25' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Quality Check Worker
        run: node scripts/workers/quality-check.js --batch-size $BATCH_SIZE

      - name: Failure Alert Email
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: 006amanraj@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: '🚨 [Modelverse] Worker Quality Check failed'
          to: 006amanraj@gmail.com
          from: Modelverse Alert Bot <006amanraj@gmail.com>
          body: |
            Workflow ${{ github.workflow }} failed on schedule.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
