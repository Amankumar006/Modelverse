name: Merge & Editorial Synthesis

on:
  schedule:
    # Runs hourly at :30 (after individual workers have populated facts)
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Batch size of eligible models to process'
        required: false
        default: '15'

jobs:
  merge-and-editorial:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Hourly LLM-heavy cron that pushes to main; serialize runs and bound the
    # hang time so a stuck provider call can't burn the 6h default.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '15' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Editorial Worker (Grounded by Fact Completeness Gate)
        run: node scripts/workers/generate-editorial.js --batch-size $BATCH_SIZE

      - name: Commit & Push Quality Gate Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(editorial): generate verified model analysis [skip ci]"
            git push origin main
          else
            echo "No editorial artifacts to commit."
          fi

      - name: Failure Alert Email
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: 006amanraj@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: '🚨 [Modelverse] Merge & Editorial Synthesis failed'
          to: 006amanraj@gmail.com
          from: Modelverse Alert Bot <006amanraj@gmail.com>
          body: |
            Workflow ${{ github.workflow }} failed on schedule.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
