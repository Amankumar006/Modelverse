name: Discovery & Enrichment Fan-Out

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  discover-and-queue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 6-hourly cron that pushes to main; serialize runs so pushes never race.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Discover and Fan-Out Enrichment Jobs
        run: node scripts/discovery/discover-and-queue.js

      - name: Commit & Push Discovery Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(discovery): queue candidate models for enrichment [skip ci]"
            git push origin main
          else
            echo "No discovery artifacts to commit."
          fi

      - name: Failure Alert Email
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: 006amanraj@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: '🚨 [Modelverse] Discovery & Enrichment Fan-Out failed'
          to: 006amanraj@gmail.com
          from: Modelverse Alert Bot <006amanraj@gmail.com>
          body: |
            Workflow ${{ github.workflow }} failed on schedule.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
