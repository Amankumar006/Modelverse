name: Worker - Scrape Source

on:
  schedule:
    # Runs hourly at :05
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Batch size of queued jobs to process'
        required: false
        default: '25'

jobs:
  scrape-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '25' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Scrape Source Worker
        run: node scripts/workers/scrape-source.js --batch-size $BATCH_SIZE

      - name: Commit & Push Source Snapshots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache/snapshots/
          if ! git diff --staged --quiet; then
            git commit -m "chore(workers): scrape-source snapshots updated [skip ci]"
            git push origin main
          else
            echo "No new source snapshots to commit."
          fi
