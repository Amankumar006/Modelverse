name: Automated Model Ingestion & Auto-Publish Pipeline

on:
  schedule:
    # Runs 4 times a day (every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Ingestion Pipeline & Verification Engine
        run: node scripts/ingest-trending-models.js

      - name: Generate Email Digest
        run: node scripts/generate-email-digest.js



      - name: Instant Search Engine Indexing Ping (IndexNow)
        run: node scripts/ping-search-engines.js

      - name: Send Discord Channel Webhook Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/post-to-discord.js

      - name: Send Gmail Digest Notification
        if: env.NEW_MODELS_PUSHED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: 006amanraj@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: 🤖 [Modelverse] ${{ env.NEW_MODELS_COUNT }} New AI Models Auto-Published!
          to: 006amanraj@gmail.com
          from: Modelverse Ingestion Bot <006amanraj@gmail.com>
          html_body: file://data/ingestion/latest-digest.html

