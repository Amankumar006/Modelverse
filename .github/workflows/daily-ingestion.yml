name: Automated Model Ingestion & Auto-Publish Pipeline

on:
  schedule:
    # Runs 4 times a day (every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Ingestion Pipeline
        run: node scripts/ingest-trending-models.js

      - name: Generate Email Digest
        run: node scripts/generate-email-digest.js

      - name: Compile and Validate Models Index
        run: node scripts/compile-models.js

      - name: Send Gmail Digest Notification
        if: env.NEW_MODELS_PUSHED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: 006amanraj@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: 🤖 [Modelverse] ${{ env.NEW_MODELS_COUNT }} New AI Models Auto-Published!
          to: 006amanraj@gmail.com
          from: Modelverse Ingestion Bot <006amanraj@gmail.com>
          html_body: file://data/ingestion/latest-digest.html

      - name: Commit and Push New Published Models
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "feat(ingestion): auto-publish new daily AI model releases [skip ci]"
            git push origin main
          else
            echo "No new models discovered today."
          fi
