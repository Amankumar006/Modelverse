name: Daily Model Ingestion & Auto-Publish Pipeline

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Ingestion Pipeline
        run: node scripts/ingest-trending-models.js

      - name: Compile and Validate Models Index
        run: node scripts/compile-models.js

      - name: Commit and Push New Published Models
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "feat(ingestion): auto-publish new daily AI model releases [skip ci]"
            git push origin main
          else
            echo "No new models discovered today."
          fi
