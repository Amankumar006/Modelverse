name: Daily Short News Ingestion & Publishing Pipeline

on:
  schedule:
    # Runs hourly to process continuous news updates
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ingest-and-publish-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Hourly cron that pushes to main: serialize runs so overlapping runs
    # can't race each other's rebase/push, and bound the hang time.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Daily News Ingestion
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # No anon-key fallback: silently running with the anon key means every
          # write fails RLS while the run stays green. Missing secret = loud failure.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ingest-daily-news.js

      - name: Enrichment Queue Status Report
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/monitoring/queue-status.js

      - name: Worker Health Check & Discord Alert
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/monitoring/alert-on-failure.js

      - name: Send Gmail News Digest
        if: env.NEW_NEWS_PUSHED == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: 006amanraj@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: 📰 [Modelverse] Breaking AI News Auto-Published!
          to: 006amanraj@gmail.com
          from: Modelverse News Bot <006amanraj@gmail.com>
          html_body: file://data/ingestion/latest-news-digest.html

      - name: Post Daily Digest to Reddit
        if: env.NEW_NEWS_PUSHED == 'true'
        continue-on-error: true
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_SUBREDDIT: ${{ secrets.REDDIT_SUBREDDIT }}
        run: node scripts/post-to-reddit.js

      - name: Commit and Push New Articles
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "content(news): publish ${QUALITY_INDEXED:-0} indexed, ${QUALITY_UNLISTED:-0} unlisted [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No new news articles to publish today."
          fi

      - name: Re-score Unlisted News Backlog
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Hourly cadence: per-run caps multiply by 24 across a day.
          PROMOTE_CAP: '10'
          REGEN_CAP: '20'
        run: node scripts/rescore-news.js

      - name: Ping Search Engines (IndexNow + sitemap pings)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ping-search-engines.js

      - name: Send Failure Alert Email
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: 006amanraj@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "🚨 [Modelverse] Urgent: News Pipeline Failed!"
          to: 006amanraj@gmail.com
          from: Modelverse Alerts <006amanraj@gmail.com>
          body: |
            The Modelverse Daily News ingestion pipeline has encountered a fatal error and failed to complete.
            
            All feeds may be down, or the script encountered a fatal parsing error.
            Please check the GitHub Actions logs immediately:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
